# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  primary:
    <<: *default
    database: api_ponto_development
    username: postgres
    password: "1234"
    host: 10.150.110.174
    port: 5000
  # Conexão somente-leitura ao banco do Pessoas (Postgres) — substitui as
  # chamadas via Sticapi (gem `sticapi_client`/HTTP). Usuário `app.frequencia`
  # criado no Postgres do Pessoas com GRANT apenas de SELECT (sem INSERT/
  # UPDATE/DELETE) — ver `app/models/pessoas_record.rb`. Credenciais em
  # Rails encrypted credentials (`Rails.application.credentials.pessoas_db`),
  # nunca em texto puro.
  pessoas:
    <<: *default
    database: <%= Rails.application.credentials.dig(:pessoas_db, :database) %>
    username: <%= Rails.application.credentials.dig(:pessoas_db, :username) %>
    password: <%= Rails.application.credentials.dig(:pessoas_db, :password) %>
    host: <%= Rails.application.credentials.dig(:pessoas_db, :host) %>
    port: <%= Rails.application.credentials.dig(:pessoas_db, :port) %>
    # Banco de outra aplicação (Pessoas), lido só via SELECT — o Frequencia
    # nunca gerencia schema dele (sem migrations, sem schema_migrations
    # próprio aqui). Sem isso, `rails db:test:prepare`/checagem de pending
    # migrations tenta criar `schema_migrations` nesse banco e falha com
    # "permission denied for schema public" (usuário só tem GRANT SELECT).
    database_tasks: false

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: api_ponto_test
  # Mesmo padrão do development — em test, aponta pro pessoas_test local
  # (mesma convenção do config/database.yml do próprio Pessoas2).
  pessoas:
    <<: *default
    database: pessoas_test
    username: <%= Rails.application.credentials.dig(:pessoas_db, :username) %>
    password: <%= Rails.application.credentials.dig(:pessoas_db, :password) %>
    host: <%= Rails.application.credentials.dig(:pessoas_db, :host) %>
    port: <%= Rails.application.credentials.dig(:pessoas_db, :port) %>
    database_tasks: false

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  primary: &primary_production
    <<: *default
    database: api_ponto_production
    username: api_ponto
    password: <%= ENV["API_PONTO_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: api_ponto_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: api_ponto_production_queue
    migrations_paths: db/queue_migrate
  pessoas:
    <<: *default
    database: <%= Rails.application.credentials.dig(:pessoas_db, :database) %>
    username: <%= Rails.application.credentials.dig(:pessoas_db, :username) %>
    password: <%= Rails.application.credentials.dig(:pessoas_db, :password) %>
    host: <%= Rails.application.credentials.dig(:pessoas_db, :host) %>
    port: <%= Rails.application.credentials.dig(:pessoas_db, :port) %>
    # Banco de outra aplicação (Pessoas), lido só via SELECT — o Frequencia
    # nunca gerencia schema dele (sem migrations, sem schema_migrations
    # próprio aqui). Sem isso, `rails db:test:prepare`/checagem de pending
    # migrations tenta criar `schema_migrations` nesse banco e falha com
    # "permission denied for schema public" (usuário só tem GRANT SELECT).
    database_tasks: false
